# ===================================
#  Field Definitions
# ===================================

fields:
    title:
        label: initbiz.newsletter::lang.messages.title
        required: true

    content:
        label: initbiz.newsletter::lang.messages.content
        required: true
        type: richeditor
        size: large

    sent:
        label: initbiz.newsletter::lang.messages.send
        type: switch
        default: false
        span: left

    sendTo:
        type: dropdown
        span: right
        options:
            all: initbiz.newsletter::lang.messages.send_to_all
            agreed: initbiz.newsletter::lang.messages.send_to_agreed
        default: all
        trigger:
            action: show
            field: sent
            condition: checked
