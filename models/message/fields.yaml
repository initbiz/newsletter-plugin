# ===================================
#  Field Definitions
# ===================================

fields:
    title:
        label: initbiz.newsletter::lang.messages.title
        required: true

    content:
        label: initbiz.newsletter::lang.messages.content
        required: true
        type: richeditor
        size: large

    sent:
        label: initbiz.newsletter::lang.messages.send
        type: switch
        default: false
        span: left

    checkboxes:
        type: partial
        trigger:
            action: show
            field: sent
            condition: checked
