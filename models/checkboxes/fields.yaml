# ===================================
#  Field Definitions
# ===================================
fields:
    checkboxes:
      label: initbiz.newsletter::lang.settings.checkboxes
      type: datatable
      dynamicHeight: true
      columns:
         name:
             title: initbiz.newsletter::lang.settings.name
             validation:
                required:
                  message: initbiz.newsletter::lang.settings.required_error
                  requiredWith: title
                regex:
                  pattern: ^[a-z][a-z0-9]*$
                  modifiers: i
                  message: initbiz.newsletter::lang.settings.property_format_error
         required:
             title: initbiz.newsletter::lang.settings.required
             type: checkbox

         text:
             title: initbiz.newsletter::lang.settings.text
