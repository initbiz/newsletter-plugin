<div class="row">
    <div class="col-md-10 col-md-offset-1 well">
        {% if not confirmed %}
            <h6>{{thank_you_message|raw}}</h6>
        {% else %}
            {% if subscriberExist %}
                <button data-request="onUnsubscribe"
                        data-trigger-type="enable"
                        data-trigger-action="enable"
                        onclick="$(this).data('request-data', { 'email' : '{{email}}', 'token' : '{{ token }}' })"
                        data-request-success="unsubscribe(data)">
                    {{ button_text }}
                </button>
                <div class="col-md-12 input-group" id="notifications">
                    <div class="alert alert-success collapse" id="success" role="alert">
                        <span id="successMsgNC">
                        </span>
                    </div>
                    <div class="alert alert-danger collapse" id="failed" role="alert">
                        <span id="errorMsgNC">
                        </span>
                    </div>
                </div>
            {% else %}
                <h6>{{wrong_path |raw}}</h6>
            {% endif %}
        {% endif %}
    </div>
</div>
